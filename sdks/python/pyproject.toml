[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchenforge-sdk"
version = "0.1.0"
description = "Python SDK for the KitchenForge agent API (Odoo 19 kitchen MRP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-only" }
authors = [
    { name = "Southbrook Cabinetry", email = "engineering@southbrookcabinetry.space" }
]
keywords = ["kitchenforge", "odoo", "mrp", "agent", "llm", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests-mock>=1.11",
]

[project.urls]
Homepage = "https://southbrookcabinetry.space"
Source = "https://github.com/dangelojohn/southbrook-v19cr"

[tool.setuptools.packages.find]
include = ["kitchenforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
