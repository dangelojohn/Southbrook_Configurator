apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitchenforge.fullname" . }}-odoo
  labels:
    {{- include "kitchenforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: odoo
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8069
      name: http
  selector:
    app.kubernetes.io/name: {{ include "kitchenforge.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: odoo
