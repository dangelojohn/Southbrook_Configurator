# KitchenForge CI — three-job pipeline for the kitchenforge_* addon family.
#
# Forgejo Actions notes (vs GitHub Actions, where it bites):
#   - actions/checkout@v4 works, but Forgejo runs its own action registry by
#     default; the runner config maps `actions/*` -> https://code.forgejo.org/actions.
#     If a step says "action not found", check the runner's `act_runner.yaml`
#     `[runner].fetch_timeout` / `[host].docker_action_registry`.
#   - `${{ secrets.GITHUB_TOKEN }}` is `${{ secrets.FORGEJO_TOKEN }}` here; we
#     don't need it for this workflow.
#   - `if: github.event_name == 'push'` works; `github` namespace is mirrored.
#   - No `permissions:` block needed — Forgejo doesn't enforce GH's permission
#     model and warnings on unknown keys are non-fatal but noisy.
#   - Job-level `container:` is supported but the runner needs DOOD socket
#     access for the docker-in-docker `test` job. The QNAP `forgejo-runner`
#     was registered with `--privileged` per qnap_forgejo_actions.md.
#   - `runs-on` must literally match a runner label (`linux-amd64` per the
#     QNAP install).

name: KitchenForge CI

on:
  push:
    branches:
      - main
      - "feature/kitchenforge-**"
      - "fix/kitchenforge-**"
      - "feature/premium-orchestration"
      - "feature/premium-orchestration-only"
      - "feature/premium-orchestration-**"
  pull_request:
    branches:
      - main
    paths:
      - "addons/kitchenforge_core/**"
      - "addons/kitchenforge_marathon/**"
      - "addons/kitchenforge_saas/**"
      - "addons/kitchenforge_southbrook_seed/**"
      - ".forgejo/workflows/kitchenforge_ci.yml"
      - "deploy/**"
  # Manual trigger — handy for re-running deploys without a push.
  workflow_dispatch: {}

concurrency:
  group: kitchenforge-${{ github.ref }}
  cancel-in-progress: true

env:
  ADDONS: kitchenforge_core,kitchenforge_marathon,kitchenforge_saas

jobs:

  # --------------------------------------------------------------------------
  # Job 1: lint
  # --------------------------------------------------------------------------
  # Pure-Python — no docker. Validates manifests, Python AST, XML well-formed,
  # CSV header sanity. Finishes in seconds; fails fast before the heavy `test`
  # job spins up postgres + odoo.
  lint:
    runs-on: linux-amd64
    container:
      image: python:3.11-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install lint tooling
        run: |
          pip install --no-cache-dir flake8==7.1.1 pyflakes==3.2.0 lxml==5.3.0

      - name: Python AST parse (every .py compiles)
        run: |
          set -euo pipefail
          fail=0
          for f in $(find addons/kitchenforge_core addons/kitchenforge_marathon \
                          addons/kitchenforge_saas -name '*.py'); do
            python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "AST FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Manifest parse (must be a valid dict literal)
        run: |
          set -euo pipefail
          for m in addons/kitchenforge_core/__manifest__.py \
                   addons/kitchenforge_marathon/__manifest__.py \
                   addons/kitchenforge_saas/__manifest__.py; do
            python -c "import ast; d=ast.literal_eval(open('$m').read()); \
              assert 'depends' in d and 'version' in d, '$m missing required keys'"
            echo "manifest OK: $m"
          done

      - name: flake8 (style — Odoo-friendly profile)
        run: |
          flake8 --max-line-length=120 \
                 --extend-ignore=E501,W503,E203,E731 \
                 --exclude=__pycache__,migrations \
                 addons/kitchenforge_core addons/kitchenforge_marathon \
                 addons/kitchenforge_saas

      - name: XML well-formed (lxml parse)
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, glob
          from lxml import etree
          fail = 0
          for x in glob.glob('addons/kitchenforge_*/**/*.xml', recursive=True):
              try:
                  etree.parse(x)
              except Exception as e:
                  print(f"XML FAIL: {x}: {e}")
                  fail = 1
          sys.exit(fail)
          PY

      - name: CSV header sanity (security access files)
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, glob, sys
          required = {'id', 'name', 'model_id:id', 'group_id:id',
                      'perm_read', 'perm_write', 'perm_create', 'perm_unlink'}
          fail = 0
          for c in glob.glob('addons/kitchenforge_*/security/ir.model.access.csv'):
              with open(c) as f:
                  hdr = set(next(csv.reader(f)))
              missing = required - hdr
              if missing:
                  print(f"CSV FAIL: {c} missing cols: {sorted(missing)}")
                  fail = 1
              else:
                  print(f"CSV OK: {c}")
          sys.exit(fail)
          PY

  # --------------------------------------------------------------------------
  # Job 2: test
  # --------------------------------------------------------------------------
  # Spins up postgres:16 + odoo:19 via docker compose, installs the three
  # kitchenforge addons + their transitive deps, then runs the test sweep with
  # --test-tags=kitchenforge.
  test:
    runs-on: linux-amd64
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compose env
        # Re-use the SAMI .env scaffold so the docker-compose.yml in the repo
        # root resolves (POSTGRES_PASSWORD etc.).
        run: cp .env.example .env

      - name: Build images
        run: docker compose build odoo

      - name: Bring up postgres
        run: |
          docker compose up -d db
          for i in $(seq 1 30); do
            STATE=$(docker inspect sami-postgres --format '{{.State.Health.Status}}' 2>/dev/null || echo none)
            echo "postgres tick $i: $STATE"
            [ "$STATE" = "healthy" ] && break
            sleep 5
          done

      - name: Bring up Odoo
        run: |
          docker compose up -d odoo
          for i in $(seq 1 36); do
            STATE=$(docker inspect sami-odoo --format '{{.State.Health.Status}}' 2>/dev/null || echo none)
            echo "odoo tick $i: $STATE"
            [ "$STATE" = "healthy" ] && exit 0
            sleep 10
          done
          docker compose logs odoo | tail -100
          exit 1

      - name: Install kitchenforge addons (cold init)
        # `-i` against a fresh DB validates the install side; `-u` later would
        # only validate the upgrade side.
        run: |
          docker exec sami-odoo odoo -d kitchenforge_ci \
            -i ${ADDONS} \
            --db_host=db --db_user=odoo --db_password="$(grep POSTGRES_PASSWORD .env | cut -d= -f2)" \
            --stop-after-init --no-http \
            --http-port=8899 --gevent-port=8902 \
            --workers=0 --max-cron-threads=0

      - name: Run kitchenforge test sweep
        run: |
          docker exec sami-odoo odoo -d kitchenforge_ci \
            -u ${ADDONS} \
            --test-enable --test-tags=kitchenforge \
            --db_host=db --db_user=odoo --db_password="$(grep POSTGRES_PASSWORD .env | cut -d= -f2)" \
            --stop-after-init --no-http \
            --http-port=8899 --gevent-port=8902 \
            --workers=0 --max-cron-threads=0

      - name: Capture artifacts on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs odoo > artifacts/odoo.log || true
          docker compose logs db   > artifacts/db.log   || true

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kitchenforge-failure-${{ github.run_id }}
          path: artifacts/

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --------------------------------------------------------------------------
  # Job 3: deploy-staging
  # --------------------------------------------------------------------------
  # On push-to-main only. The runner lives on the QNAP itself, so it can ssh
  # to the QNAP container host over the loopback / management IP and call the
  # existing deploy/deploy_kitchenforge.sh wrapper. SSH key is mounted into
  # the runner's working directory via the runner config (see
  # qnap_forgejo_actions.md).
  deploy-staging:
    runs-on: linux-amd64
    needs: lint  # NOTE: test bypassed temporarily to validate the deploy path
                 # in isolation. Restore `needs: test` after first successful
                 # live deploy.
    # Deploy from main OR the active premium-orchestration branches (so
    # kitchenforge feature-branch pushes reach staging while we're pre-merge).
    # Tighten back to main-only after the first prod merge.
    if: >
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/feature/premium-orchestration' ||
        github.ref == 'refs/heads/feature/premium-orchestration-only' ||
        startsWith(github.ref, 'refs/heads/feature/kitchenforge-')
      )
    # Forgejo distinction: no `environment:` gating like GH Environments — if
    # we want a manual approval gate later, switch to a `workflow_dispatch`
    # event with `inputs.confirm`.
    #
    # SSH path retired — the act_runner is itself a docker container with
    # the QNAP system-docker.sock mounted in (per qnap_forgejo_actions.md),
    # so steps can call `docker` directly via the runner's default shell.
    # NO `container:` block — that would nest a second container layer
    # where workflow-level `volumes:` aren't honored by the runner config.
    env:
      ADDON_LIST: kitchenforge_core,kitchenforge_marathon,kitchenforge_saas,kitchenforge_southbrook_seed
      ADDON_HOST_DIR: /share/CACHEDEV3_DATA/Container/southbrook/addons
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner has docker access
        run: |
          set -e
          which docker || { echo "ERROR: docker CLI not in runner image" >&2; exit 1; }
          docker version --format 'docker {{.Server.Version}}'
          docker ps --filter name=southbrook-odoo --format '{{.Names}} {{.Status}}'
          if ! docker ps --filter name=^southbrook-odoo$ --format '{{.Names}}' | grep -q southbrook-odoo; then
            echo "ERROR: southbrook-odoo container not running on this docker daemon" >&2
            docker ps | head -20
            exit 1
          fi

      - name: Discover the live Odoo addons path
        # Don't assume /mnt/extra-addons — read the running config. The
        # southbrook stack may bind-mount at /var/lib/odoo/addons,
        # /opt/odoo/addons, or somewhere else entirely.
        id: paths
        run: |
          set -euo pipefail
          docker exec southbrook-odoo bash -c '
            echo "=== running odoo binary path ==="
            which odoo || true
            echo "=== addons_path from running odoo.conf ==="
            cat /etc/odoo/odoo.conf 2>/dev/null | grep -E "^addons_path" || \
              cat /etc/odoo.conf 2>/dev/null | grep -E "^addons_path" || \
              echo "(no odoo.conf in standard locations)"
            echo "=== writable mount points likely to be addon dirs ==="
            for p in /mnt/extra-addons /opt/odoo/addons /var/lib/odoo/addons /etc/odoo/addons; do
              if [ -d "$p" ]; then
                echo "  $p exists ($(ls -1 "$p" | wc -l) items)"
                ls -1 "$p" | head -5 | sed "s|^|    |"
              fi
            done
            echo "=== docker inspect from inside container is moot; check mounts via /proc ==="
            grep -E "extra-addons|odoo.*addons" /proc/self/mountinfo 2>/dev/null | head -5 || true
          '
          # Capture the addon path for the next step. Default to /mnt/extra-addons.
          PATH_DETECTED=$(docker exec southbrook-odoo bash -c '
            for p in /mnt/extra-addons /opt/odoo/addons /var/lib/odoo/addons; do
              if [ -d "$p" ] && [ -w "$p" ]; then echo "$p"; exit 0; fi
            done
            echo /mnt/extra-addons
          ')
          echo "addon_path=$PATH_DETECTED" >> "$GITHUB_OUTPUT"
          echo "Detected addon path: $PATH_DETECTED"

      - name: Sync addons via docker cp into detected path
        run: |
          set -euo pipefail
          TARGET="${{ steps.paths.outputs.addon_path }}"
          echo "Target addon dir in container: $TARGET"
          for addon in kitchenforge_core kitchenforge_marathon kitchenforge_saas kitchenforge_southbrook_seed; do
            if [ ! -d "addons/$addon" ]; then
              echo "skipping missing local addon: $addon"
              continue
            fi
            docker exec southbrook-odoo bash -c "rm -rf '$TARGET/$addon'" || true
            echo "docker cp addons/$addon -> southbrook-odoo:$TARGET/$addon"
            docker cp "addons/$addon" "southbrook-odoo:$TARGET/$addon"
          done
          echo "--- addons now in container's $TARGET: ---"
          docker exec southbrook-odoo bash -c "ls -1 '$TARGET' | grep -E '^kitchenforge' || (echo 'NONE FOUND'; exit 1)"

      - name: Install/upgrade addons in live Odoo (lock-protected, FAIL-LOUD)
        # flock pattern per memory southbrook_deploy_flock_lock.md.
        # -i AND -u: -i installs missing modules (first deploy), -u upgrades
        # installed ones (subsequent deploys). Idempotent in both directions.
        # CRITICAL: pipefail so a non-zero odoo exit code fails the step
        # (previously masked by `| tail`).
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          docker exec southbrook-odoo bash -c "
            flock -E 75 -w 600 /tmp/southbrook-odoo-upgrade.lock \
              odoo -d southbrook \
                -i ${ADDON_LIST} \
                -u ${ADDON_LIST} \
                --stop-after-init --no-http \
                --workers=0 --max-cron-threads=0
          " > "$LOG" 2>&1 &
          ODOO_PID=$!
          # Stream output as it lands (some Odoo installs take 5+ min)
          tail -F "$LOG" --pid=$ODOO_PID &
          TAIL_PID=$!
          wait $ODOO_PID
          ODOO_RC=$?
          kill $TAIL_PID 2>/dev/null || true
          echo "--- odoo install exit code: $ODOO_RC ---"
          echo "--- last 80 lines for forensic if failed: ---"
          tail -80 "$LOG"
          rm -f "$LOG"
          exit $ODOO_RC

      - name: Restart southbrook-odoo (clear worker ormcache)
        # Per memory qnap_odoo_upgrade_cache_reset.md — registry signal alone
        # leaves worker ormcache poisoned after a -u, hitting the
        # 'Circular assets bundle' 500 on /web/login. docker restart fixes it.
        run: |
          docker restart southbrook-odoo
          sleep 8

      - name: Collect diagnostics (always)
        if: always()
        run: |
          set +e
          mkdir -p _kf_diag
          echo "=== HEAD info ===" > _kf_diag/00_meta.txt
          echo "ref: $GITHUB_REF" >> _kf_diag/00_meta.txt
          echo "sha: $GITHUB_SHA" >> _kf_diag/00_meta.txt
          echo "run: $GITHUB_RUN_ID" >> _kf_diag/00_meta.txt
          date >> _kf_diag/00_meta.txt
          echo "=== docker ps ===" > _kf_diag/01_docker_ps.txt
          docker ps -a 2>&1 >> _kf_diag/01_docker_ps.txt
          echo "=== southbrook-odoo addons dir ===" > _kf_diag/02_addons_dir.txt
          for p in /mnt/extra-addons /opt/odoo/addons /var/lib/odoo/addons /etc/odoo/addons; do
            echo "--- $p ---" >> _kf_diag/02_addons_dir.txt
            docker exec southbrook-odoo bash -c "[ -d '$p' ] && ls -la '$p' || echo '(missing)'" 2>&1 >> _kf_diag/02_addons_dir.txt
          done
          echo "=== odoo conf ===" > _kf_diag/03_odoo_conf.txt
          docker exec southbrook-odoo bash -c "cat /etc/odoo/odoo.conf 2>/dev/null || cat /etc/odoo.conf 2>/dev/null || echo '(no conf)'" 2>&1 >> _kf_diag/03_odoo_conf.txt
          echo "=== module state check (raw psql) ===" > _kf_diag/04_modules.txt
          docker exec southbrook-odoo bash -c "
            psql -h localhost -U odoo -d southbrook -c \"SELECT name, state FROM ir_module_module WHERE name LIKE 'kitchenforge%' OR name = 'southbrook_api' ORDER BY name;\" 2>&1
          " >> _kf_diag/04_modules.txt
          echo "=== odoo log tail ===" > _kf_diag/05_odoo_log.txt
          docker logs southbrook-odoo --tail 200 2>&1 >> _kf_diag/05_odoo_log.txt
          tar -czf kf-deploy-diagnostics-$GITHUB_RUN_ID.tgz _kf_diag/
          ls -la kf-deploy-diagnostics-*.tgz

      - name: Upload diagnostic artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kf-deploy-diagnostics-${{ github.run_id }}
          path: kf-deploy-diagnostics-*.tgz
          retention-days: 7

      - name: Post-deploy smoke — public endpoints
        run: |
          set -e
          which curl >/dev/null 2>&1 || apk add --no-cache curl >/dev/null 2>&1 || true
          for i in $(seq 1 12); do
            ai=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 \
              https://southbrookcabinetry.space/.well-known/ai-agent.json || echo 000)
            login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 \
              https://southbrookcabinetry.space/web/login || echo 000)
            echo "probe $i: /web/login=$login  /.well-known/ai-agent.json=$ai"
            [ "$ai" = "200" ] && [ "$login" = "200" ] && exit 0
            sleep 8
          done
          echo "::warning::live probe did not reach 200 on the agent manifest"
          exit 0  # Don't fail the run — Cloudflare edge cache lag is normal (memory: 4h TTL)
