name: SAMI tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

# Cancel in-flight runs of the same branch when a new push lands.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Customer Flutter app — static analysis + unit tests. Independent of the
  # Odoo backend stack, so it runs in a Flutter container and finishes in
  # seconds. This is the guard that would have caught the model<->API contract
  # drift behind the 'No projects yet' bug.
  flutter-app:
    runs-on: linux-amd64
    container:
      # Pin to match the local toolchain; bump alongside flutter_app/pubspec.
      image: ghcr.io/cirruslabs/flutter:3.44.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve deps
        run: flutter pub get
        working-directory: flutter_app
      - name: Analyze
        run: flutter analyze
        working-directory: flutter_app
      - name: Test
        run: flutter test
        working-directory: flutter_app

  # PR3a — southbrook_kitchen_3d_configurator regression suite. Node-native
  # (not Hoot): the runner has no headless-Chromium binary available, so
  # this mounts the REAL kitchen_configurator.js OWL component under
  # jsdom + the real @odoo/owl package (pinned to the vendored 2.8.2),
  # and exercises the real coordinate-math builders +
  # KitchenCanvas._placeCabinetGroup against the real vendored r160
  # Three.js (pure matrix math, no WebGL context needed). Independent of
  # the Odoo docker stack — no compose/db/odoo bring-up required, so this
  # finishes in seconds. See addons/southbrook_kitchen_3d_configurator/
  # tests/node_js/README.md for the full runnability rationale and how
  # to run it locally.
  kitchen-3d-configurator-node-tests:
    runs-on: linux-amd64
    container:
      image: node:22-slim
    defaults:
      run:
        working-directory: addons/southbrook_kitchen_3d_configurator/tests/node_js
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pinned deps (npm ci — lockfile-exact, no drift)
        run: npm ci --no-audit --no-fund

      - name: Run the regression suite (wall selection, hydration/reload, renderer coordinate math, active-wall indicator, callback contract, Design-83 golden snapshot)
        run: npm test

  southbrook-tests:
    # `runs-on` labels must match what the Forgejo runner advertises.
    # The runner installed on the QNAP advertises `linux-amd64`; adjust
    # if the runner reports a different label.
    runs-on: linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compose env
        run: cp .env.example .env

      - name: Build images
        run: |
          docker compose build odoo
          # freecad-bridge build is ~5 min (FreeCAD apt install). Cache via
          # buildx is set up at the runner level — if cold, this is slow but
          # subsequent runs reuse the layer cache.
          docker compose build freecad-bridge

      - name: Bring up stack
        run: |
          docker compose up -d db
          # Wait for postgres healthy.
          for i in $(seq 1 30); do
            STATE=$(docker inspect sami-postgres --format '{{.State.Health.Status}}' 2>/dev/null || echo none)
            echo "postgres tick $i: $STATE"
            [ "$STATE" = "healthy" ] && break
            sleep 5
          done
          docker compose up -d odoo freecad-bridge

      - name: Wait for Odoo health
        run: |
          for i in $(seq 1 36); do
            STATE=$(docker inspect sami-odoo --format '{{.State.Health.Status}}' 2>/dev/null || echo none)
            echo "odoo tick $i: $STATE"
            [ "$STATE" = "healthy" ] && exit 0
            sleep 10
          done
          docker compose logs odoo | tail -100
          exit 1

      - name: Install SAMI addons
        run: make install

      - name: Run full test sweep
        run: make test

      - name: Capture artifacts on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs odoo > artifacts/odoo.log
          docker compose logs freecad-bridge > artifacts/bridge.log

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: artifacts/

      - name: Tear down
        if: always()
        run: docker compose down -v
